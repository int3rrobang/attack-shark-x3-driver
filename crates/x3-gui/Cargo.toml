[package]
name = "x3-gui"
description = "Slint desktop frontend for Attack Shark X3/M600-family mice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = ["usb"]
usb = ["attack-shark-x3-manager/usb"]
ble = ["attack-shark-x3-manager/ble"]

[dependencies]
attack-shark-x3 = { path = "../attack-shark-x3", default-features = false }
attack-shark-x3-manager = { path = "../attack-shark-x3-manager", default-features = false }
rfd = { version = "0.16", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.17.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "renderer-femtovg",
    "std",
]}
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
# rfd's build script requires a Linux backend; xdg-portal is pure Rust (no GTK
# sysdeps) but needs an async runtime feature, matching the crate's tokio use.
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1.17.1"
[lints.rust]
# Slint's generated item-tree glue contains audited unsafe internals (isolated to generated_ui).
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
