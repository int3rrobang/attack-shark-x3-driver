[package]
name = "attack-shark-x3-manager"
description = "Headless device operations, durable state, and safety policy for Attack Shark X3/M600-family mice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["usb"]
usb = ["attack-shark-x3/usb", "dep:tokio"]
ble = ["attack-shark-x3/ble", "dep:tokio"]

[dependencies]
attack-shark-x3 = { path = "../attack-shark-x3", default-features = false, features = ["serde"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fs2 = "0.4"
tokio = { version = "1", features = ["rt", "sync", "time"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
