[package]
name = "x3ctl"
description = "Resource-oriented CLI frontend for Attack Shark X3/M600-family mice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["usb"]
usb = ["attack-shark-x3-manager/usb"]
ble = ["attack-shark-x3-manager/ble"]

[dependencies]
attack-shark-x3-manager = { path = "../attack-shark-x3-manager", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
	"macros",
	"rt",
	"rt-multi-thread",
	"time",
] }

[lints]
workspace = true
