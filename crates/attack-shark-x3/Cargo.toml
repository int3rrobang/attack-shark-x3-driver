[package]
name = "attack-shark-x3"
description = "Cross-platform protocol library and driver for Attack Shark X3/M600-family mice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["usb"]
serde = ["dep:serde", "bluest?/serde"]
usb = ["dep:hidapi", "dep:tokio"]
ble = ["dep:bluest", "dep:futures-lite", "dep:windows", "dep:tokio"]
[dependencies]
bluest = { version = "0.6.9", optional = true }
hidapi = { version = "2", optional = true }
futures-lite = { version = "1.13", optional = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.48", features = [
	"Devices_Bluetooth",
	"Devices_Enumeration",
	"Foundation",
	"Foundation_Collections",
	"Storage_Streams",
	"Devices_Bluetooth_GenericAttributeProfile",
], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[[example]]
name = "receiver-smoke"
path = "examples/receiver-smoke.rs"
required-features = ["usb"]

[[example]]
name = "dpi-framing-probe"
path = "examples/dpi-framing-probe.rs"
required-features = ["usb"]

[[example]]
name = "factory-profile-recovery"
path = "examples/factory-profile-recovery.rs"
required-features = ["usb"]

[[example]]
name = "profile-switch-transport-probe"
path = "examples/profile-switch-transport-probe.rs"
required-features = ["usb"]

[[example]]
name = "hid-enum"
path = "examples/hid-enum.rs"
required-features = ["usb"]

[[example]]
name = "probe_layout"
path = "examples/probe_layout.rs"
required-features = ["usb"]

[[example]]
name = "profile-navigation-probe"
path = "examples/profile-navigation-probe.rs"
required-features = ["usb"]
[[example]]
name = "macro-wired"
path = "examples/macro-wired.rs"
required-features = ["usb"]

[[example]]
name = "profile-activate"
path = "examples/profile-activate.rs"
required-features = ["usb"]

[[example]]
name = "reset-macros"
path = "examples/reset-macros.rs"
required-features = ["usb"]
