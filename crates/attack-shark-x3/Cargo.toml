[package]
name = "attack-shark-x3"
description = "Cross-platform protocol library and driver for Attack Shark X3/M600-family mice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["usb"]
serde = ["dep:serde"]
usb = ["dep:hidapi"]
ble = ["dep:bluest", "dep:futures-lite", "dep:windows"]

[dependencies]
bluest = { version = "0.6.9", features = ["serde"], optional = true }
hidapi = { version = "2", optional = true }
futures-lite = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.48", features = [
	"Devices_Bluetooth",
	"Devices_Enumeration",
	"Foundation",
	"Foundation_Collections",
	"Storage_Streams",
	"Devices_Bluetooth_GenericAttributeProfile",
], optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

[[example]]
name = "receiver-smoke"
path = "examples/receiver-smoke.rs"
required-features = ["usb"]

[[example]]
name = "dpi-framing-probe"
path = "examples/dpi-framing-probe.rs"
required-features = ["usb"]