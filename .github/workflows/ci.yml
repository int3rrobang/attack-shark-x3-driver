name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  linux:
    name: Linux (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.97.1, rustfmt, clippy, rust-analyzer)
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --component rust-analyzer --component rust-src
          rustup default 1.97.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  windows:
    name: Windows (check + test)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (1.97.1)
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --component rust-analyzer --component rust-src
          rustup default 1.97.1

      - name: cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features
